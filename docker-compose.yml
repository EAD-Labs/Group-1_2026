# The app and its PostgreSQL database.
#   cp .env.docker.example .env   then fill in JWT_SECRET and DB_PASSWORD
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edupyramids
      POSTGRES_USER: edupyramids
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edupyramids -d edupyramids"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://edupyramids:${DB_PASSWORD}@db:5432/edupyramids
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      SCHOOL_AUTH_URL: ${SCHOOL_AUTH_URL:-}
      SCHOOL_AUTH_API_KEY: ${SCHOOL_AUTH_API_KEY:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-}
    ports:
      - "${APP_PORT:-5000}:5000"

volumes:
  pgdata:
